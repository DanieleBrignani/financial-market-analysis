name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >
            any::quantmod any::xts any::zoo any::ggplot2 any::tidyr
            any::scales any::sandwich any::lmtest any::tseries
            any::yaml any::testthat

      - name: Unit tests
        run: Rscript tests/testthat.R

      # The offline path needs data/processed/monthly_prices.csv to be present
      # in the repository. Until it is committed, fall back to a live run so the
      # pipeline is still exercised rather than silently skipped.
      - name: Pipeline smoke test
        run: |
          if [ -f data/processed/monthly_prices.csv ]; then
            echo "Snapshot found -- running offline (deterministic)."
            Rscript scripts/run_analysis.R --offline
          else
            echo "::warning::No committed snapshot; running live against Yahoo/FRED."
            echo "Commit data/processed/monthly_prices.csv to make CI deterministic."
            Rscript scripts/run_analysis.R
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-output
          path: output/
